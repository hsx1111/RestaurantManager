<section class="page">
  <div class="entete">
    <h1>Personnel</h1>
    <button type="button" class="ajouter" (click)="ajouter()">+ Ajouter</button>
  </div>

  @if (erreur()) {
    <p class="banniere-erreur">{{ erreur() }}</p>
  }

  <table class="tableau">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Rôle</th>
        <th class="col-actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (utilisateur of utilisateurs(); track utilisateur.id) {
        <tr>
          <td>{{ utilisateur.nom }}</td>
          <td>{{ utilisateur.prenom }}</td>
          <td><span class="badge">{{ utilisateur.role }}</span></td>
          <td class="col-actions">
            <button type="button" class="icone" title="Modifier" (click)="editer(utilisateur)">✏️</button>
            <button type="button" class="icone" title="Supprimer" (click)="demanderSuppression(utilisateur)">🗑️</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="vide">Aucun membre.</td>
        </tr>
      }
    </tbody>
  </table>
</section>

@if (formOuvert()) {
  <app-personnel-form
    [utilisateur]="enEdition()"
    (enregistrer)="enregistrer($event)"
    (annuler)="fermerForm()"
  />
}

@if (confirmOuvert()) {
  <app-confirm-dialog
    titre="Supprimer le membre"
    [message]="'Supprimer ' + (aSupprimer()?.prenom ?? '') + ' ' + (aSupprimer()?.nom ?? '') + ' ?'"
    libelleConfirmer="Supprimer"
    couleur="rouge"
    (confirmer)="confirmerSuppression()"
    (annuler)="fermerConfirm()"
  />
}
