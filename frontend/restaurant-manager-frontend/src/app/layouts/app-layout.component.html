<div class="app">
  <header class="topbar">
    <span class="logo">🍽️ Restaurant Manager</span>
    <div class="droite">
      @if (utilisateur(); as u) {
        <span class="user">
          {{ u.prenom }} {{ u.nom }}
          <span class="role">{{ u.role }}</span>
        </span>
      }
      <button type="button" class="deconnexion" (click)="deconnexion()">Déconnexion</button>
    </div>
  </header>

  <div class="corps">
    <nav class="sidebar">
      @for (lien of liensVisibles(); track lien.route) {
        <a [routerLink]="lien.route" routerLinkActive="actif">{{ lien.label }}</a>
      }
    </nav>

    <main class="contenu">
      <router-outlet />
    </main>
  </div>
</div>
